name: Release

# What users download, built only from what the gates passed.
#
# The bundle is the FRONTEND. It carries no cores and downloads none: those
# are other repositories that publish themselves, and a user puts the packages
# they want in the Cores folder (docs/core-manager.md). Each core's own releases
# are its archive; the `cores` release here is the OLD one, kept because movies
# recorded before the split cite packages in it, and it no longer grows.
#
# A release is IMMUTABLE and NEVER deleted. A movie cites the build that
# recorded it, and someone replaying that run in five years needs THAT build -
# not a rebuild, because a package's identity is a function of its toolchain, so
# the same sources through a later gcc are different bytes and a different hash.
#
# It is cut BY HAND, when the batch it marks is in (user-decided, 2026-11-15):
# Actions > Release > Run workflow. There is no rolling dev build and no daily
# version cut. The version is the next patch, or a minor version tagged by hand
# at the commit first; the newest release is the one GitHub shows as Latest.
#
# Nothing is published that did not pass CI: the run refuses unless a CI run for
# the same commit succeeded.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (windows + linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: What is being released
        id: what
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "${{ github.sha }}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.sha }}
          # NOT recursive: the bundle carries no cores (docs/core-manager.md), so
          # what it needs checked out is what the FRONTEND is built from
          submodules: false
          fetch-depth: 0

      - name: Check out what the frontend is built from
        run: git submodule update --init --recursive extern

      - name: Was this commit gated?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any successful CI run of this commit counts: a push's run and the
          # daily run are the same gate. The daily run starts hours late
          # (2026-11-15: asked for 04:00, started at 11:45), so the newest run
          # alone is not the question.
          conclusion=$(gh run list --workflow CI --branch chimera-csx --limit 20 \
            --json headSha,conclusion --jq \
            "[.[] | select(.headSha == \"$(git rev-parse HEAD)\" and .conclusion == \"success\")] | first | .conclusion")
          if [ "$conclusion" != "success" ]; then
            echo "no successful CI run for $(git rev-parse --short HEAD)" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mingw-w64 \
            libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build the Linux bundle
        run: ./tools/build-bundle.sh --platform linux --out build/bundle-linux

      - name: Build the Windows bundle
        # only the natives differ between the two: the managed assemblies are IL
        run: ./tools/build-bundle.sh --platform windows --out build/bundle-windows

      - name: Pack
        id: pack
        run: |
          name=$(tools/bundle-name.sh)
          mkdir -p build/release
          # one top-level folder, named like the archive, so both unpack into a
          # directory instead of the one they were unpacked in
          cp -r build/bundle-windows "build/$name"
          ( cd build && zip -qr "release/$name.zip" "$name" )
          rm -rf "build/$name"
          cp -r build/bundle-linux "build/$name"
          ( cd build && tar czf "release/$name.tar.gz" "$name" )
          rm -rf "build/$name"
          cp build/bundle-windows/LICENSES.md build/release/LICENSES.md
          cp build/bundle-windows/BUILD.txt build/release/BUILD.txt
          ls -la build/release

      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${{ steps.what.outputs.short }}"
          name=$(tools/bundle-name.sh)
          # The PREVIOUS release, not the tag being published: a minor version
          # is tagged at this commit by hand, and "since 1.5.0" would list
          # nothing. Everything that landed since then, not just the top commit
          # (issue #76). With nothing to measure from (the first build, a
          # shallow clone) the top commit alone.
          since=""
          for candidate in $(git tag -l '[0-9]*' --sort=-v:refname); do
            if [ "$(git rev-list -n1 "$candidate")" != "$(git rev-parse HEAD)" ]; then
              since="$candidate"
              break
            fi
          done
          if [ -n "$since" ] && git rev-parse -q --verify "$since^{commit}" >/dev/null 2>&1 \
             && [ "$(git rev-parse "$since^{commit}")" != "$(git rev-parse HEAD)" ]; then
            changes=$(git log --no-merges --format='- %s (`%h`)' "$since..HEAD")
          else
            changes=""
          fi
          {
            echo "Built from \`$short\` - $(git log -1 --format=%s)"
            echo
            if [ -n "$changes" ]; then
              echo "Since $since:"
              echo
              echo "$changes"
              echo
            fi
            echo "| what | file |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`$name.zip\` |"
            echo "| Linux x64 | \`$name.tar.gz\` |"
            echo
            echo "Both carry the frontend and its natives. They carry **no cores**, and"
            echo "Chimera downloads none: get a core's \`.chimeraCore\` package from the"
            echo "project that builds it and put it in the \`Cores\` folder beside Chimera."
            echo "\`BUILD.txt\` names the exact commit this was built from and"
            echo "\`LICENSES.md\` states its terms."
            echo
            echo "Each core brings its own licence with it, and some (Genesis Plus GX,"
            echo "Opera, Snes9x) forbid commercial use - which binds whatever they are"
            echo "installed into. Chimera shows a core's terms once it is in the folder."
            echo
            echo "Windows will warn that the executable is unsigned and from an unknown"
            echo "publisher; it is not signed, and there is no way around that warning"
            echo "short of buying a certificate."
            echo
          } > build/release/NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/release-retry.sh
          tag=$(tools/release-version.sh next)
          # A release that holds its bundles is never republished; one that
          # exists EMPTY is a publish that died between create and upload, and
          # finishing it is the only way it becomes what its name says.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^chimera-.*\.zip$'; then
            echo "$tag already exists"; exit 0
          fi
          made="$(python3 tools/european-time.py "$(git log -1 --format=%ct "${{ steps.what.outputs.sha }}")")"
          ensure_release "$tag" "${{ steps.what.outputs.sha }}" \
            "Release $tag (${{ steps.what.outputs.short }}, made $made)" build/release/NOTES.md
          retry gh release upload "$tag" build/release/chimera-*.zip build/release/chimera-*.tar.gz \
            build/release/LICENSES.md build/release/BUILD.txt --clobber
